  <script>
    (() => {
      let attempts = 0;
      function promoteAfterLegacyRender() {
        attempts += 1;
        const host = document.getElementById('late-layout-host');
        const legacy = host?.querySelector(':scope > .team_general_content');
        const panel = document.getElementById('slf-team4-championship-table');
        if (!host || !legacy || !panel || panel.dataset.slfTeamLayout !== 'legacy-content') {
          if (attempts < 80) return setTimeout(promoteAfterLegacyRender, 50);
          window.__lateLayoutFailure = 'legacy panel was not rendered before promotion';
          return;
        }

        window.__lateLayoutBeforePromotion = panel.dataset.slfTeamLayout;
        window.__legacyUpcomingPresentBeforeRemoval = !!legacy.querySelector('.team-games__near');
        legacy.querySelector('.team-games__near')?.remove();
        window.__legacyUpcomingRemoved = !document.querySelector('.team-games__near');
        const dash = host.querySelector(':scope > .team-dash');
        const general = legacy.querySelector(':scope > #general');
        const extras = [...legacy.children].filter(node => node !== general);
        const body = document.createElement('div');
        body.className = 'team-body';
        const content = document.createElement('div');
        content.className = 'team-content';
        content.appendChild(general);
        dash.classList.remove('team_general_calendar');
        body.append(dash, content, ...extras);
        host.replaceWith(body);
        window.__lateLayoutPromoted = true;
      }
      setTimeout(promoteAfterLegacyRender, 50);
    })();
  </script>
