<script>
/* issue #375: mirrors the live dark-design site handler — a click on a dirs
   toggle flips ONLY that button's aria-pressed (independent multi-select).
   The fixed engine's β priority path clicks the button and re-reads
   aria-pressed in a later task; without this bubble handler the readback
   could never observe the state the real page produces. */
(function () {
  "use strict";
  document.addEventListener("click", function (event) {
    var button = event.target && event.target.closest
      ? event.target.closest(".tc-seg--dirs button[data-option^='priority_']")
      : null;
    if (!button) return;
    var pressed = button.getAttribute("aria-pressed") === "true";
    button.setAttribute("aria-pressed", pressed ? "false" : "true");
  });
})();
</script>
