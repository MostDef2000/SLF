<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>SLF fm2026v2 team4 tactic page (team4.php?action=tactic)</title>
  <style>
    :root {
      --fm-panel:#171b29; --fm-panel-2:#1c2132; --fm-panel-3:#222842;
      --fm-border-2:#38415f; --fm-text:#eef1f8; --fm-muted:#8b93ab;
      --fm-green:#2bd97c; --fm-radius:14px;
      --fm-font:"Roboto","Segoe UI",Arial,sans-serif;
    }
    *{box-sizing:border-box}
    body{margin:0;min-width:1200px;background:#0d1018;color:var(--fm-text);font-family:var(--fm-font)}
    .fm-stage{width:min(100% - 48px,1480px);margin:24px auto}
    .content-ui__wrapper{min-width:0;background:#101522;border-radius:14px;padding:18px;overflow:hidden}
    form.tactics__form{padding:14px;background:var(--fm-panel);border:1px solid var(--fm-border-2);border-radius:var(--fm-radius)}
    .h2{font-size:17px;margin-bottom:12px}
    /* grid CSS reused from fixtures/fm2026-team-tactic.html (v1 markup) */
    .ui-tactic__wrap{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
    .ui-tactic__card{padding:12px;background:var(--fm-panel-2);border:1px solid var(--fm-border-2);border-radius:12px}
    .ui-tactic__caption{margin-bottom:8px;font-weight:700}
    .control-grid{display:grid;gap:5px}
    .control-row{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
    .control-row>span{width:90px;color:var(--fm-muted)}
    label{display:inline-flex;align-items:center;gap:2px;padding:3px 5px;background:var(--fm-panel-3);border-radius:5px}
    label.__active{outline:1px solid var(--fm-green)}
    input.tactics__input{display:none}
  </style>
</head>
<body>
  <!-- fm2026v2 team4 tactic markup: no .team_general_content, no .team > .team-head
       (header absent), form.tactics__form wraps .ui-tactic__wrap with three card
       sections; the defence card wraps its radio groups in .team-control__block. -->
  <main class="fm-stage">
    <section class="content-ui__wrapper">
      <form class="tactics__form" method="post" action="/team4.php?action=tactic">
        <div class="h2">Тактика на матч</div>
        <div class="ui-tactic__wrap">
          <section class="ui-tactic__card">
            <div class="ui-tactic__caption">Оборона</div>
            <div class="team-control__block">
              <div class="control-grid" id="defence-controls"></div>
            </div>
          </section>
          <section class="ui-tactic__card">
            <div class="ui-tactic__caption">Построение атаки</div>
            <div class="control-grid" id="build-controls"></div>
          </section>
          <section class="ui-tactic__card">
            <div class="ui-tactic__caption">Атака</div>
            <div class="control-grid" id="attack-controls"></div>
          </section>
        </div>
      </form>
    </section>
  </main>
  <script>
    (() => {
      const groups = {
        'defence-controls': {def_line:3,press_line:3,def_width:3,press_intense:5},
        'build-controls': {build_type:3,build_temp:3,build_long:3,build_fast:3},
        'attack-controls': {style:5,pass_risk:5,dribble:5,cross:3,corner:2,shot:3}
      };
      Object.entries(groups).forEach(([targetId, controls]) => {
        const target = document.getElementById(targetId);
        Object.entries(controls).forEach(([name, maxValue]) => {
          const row = document.createElement('div');
          row.className = 'control-row tactics__row';
          const caption = document.createElement('span');
          caption.textContent = name;
          row.appendChild(caption);
          const choice = document.createElement('div');
          choice.className = `tactic__choice choice__pattern_${name}`;
          choice.dataset.option = name;
          for (let value = 1; value <= maxValue; value += 1) {
            const label = document.createElement('label');
            label.dataset.value = String(value);
            if (value === 2) label.className = '__active';
            const input = document.createElement('input');
            input.type = 'radio'; input.className = 'tactics__input';
            input.name = name; input.value = String(value); input.checked = value === 2;
            input.addEventListener('change', () => {
              choice.querySelectorAll('label').forEach(node => node.classList.remove('__active'));
              label.classList.add('__active');
            });
            label.append(input, document.createTextNode(String(value)));
            choice.appendChild(label);
          }
          row.appendChild(choice);
          target.appendChild(row);
        });
      });
      const priorityRow = document.createElement('div');
      priorityRow.className = 'control-row';
      const priorityCaption = document.createElement('span');
      priorityCaption.textContent = 'priority';
      priorityRow.appendChild(priorityCaption);
      ['l','c','r'].forEach(suffix => {
        const choice = document.createElement('div');
        choice.className = 'tactic__choice';
        choice.dataset.option = `priority_${suffix}`;
        for (const value of ['0','1']) {
          const label = document.createElement('label');
          label.dataset.value = value;
          if (value === '0') label.className = '__active';
          const input = document.createElement('input');
          input.type = 'radio'; input.className = 'tactics__input';
          input.name = `priority_${suffix}`; input.value = value; input.checked = value === '0';
          label.append(input, document.createTextNode(value));
          choice.appendChild(label);
        }
        priorityRow.appendChild(choice);
      });
      document.getElementById('attack-controls').appendChild(priorityRow);
    })();
  </script>
</body>
</html>
