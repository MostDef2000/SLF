  <script>
    window.__lineupPreviewCalls = 0;
    window.__lineupSaveClicks = 0;
    window.__lineupSavePayload = null;
    window.__playerBindingHits = 0;
    window.cf1_options_load = function () { window.__lineupPreviewCalls += 1; };
    document.querySelectorAll('.control_field_1 .control_lineup').forEach(function (card) {
      card.addEventListener('mousedown', function () { window.__playerBindingHits += 1; });
    });
    document.querySelector('.lineup_send').addEventListener('click', function () {
      window.__lineupSaveClicks += 1;
      var payload = {};
      document.querySelectorAll('.control_field_1 .control_lineup').forEach(function (card) {
        var position = window.jQuery(card).data('position') || card.dataset.position;
        payload[position] = card.dataset.player;
      });
      window.__lineupSavePayload = payload;
    });
  </script>
