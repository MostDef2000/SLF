<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><title>SLF E2E team tactic page</title></head>
<body>
  <div id="head">SLF fixture header</div>
  <main class="team_general_content">
    <label><input type="radio" name="def_line" value="2" checked>def_line</label>
    <label><input type="radio" name="press_line" value="2" checked>press_line</label>
    <label><input type="radio" name="def_width" value="2" checked>def_width</label>
    <label><input type="radio" name="press_intense" value="2" checked>press_intense</label>
    <label><input type="radio" name="build_type" value="2" checked>build_type</label>
    <label><input type="radio" name="build_temp" value="2" checked>build_temp</label>
    <label><input type="radio" name="build_long" value="2" checked>build_long</label>
    <label><input type="radio" name="build_fast" value="2" checked>build_fast</label>
    <label><input type="radio" name="style" value="3" checked>style</label>
    <label><input type="radio" name="pass_risk" value="2" checked>pass_risk</label>
    <label><input type="radio" name="dribble" value="2" checked>dribble</label>
    <label><input type="radio" name="cross" value="2" checked>cross</label>
    <label><input type="radio" name="corner" value="1" checked>corner</label>
    <label><input type="radio" name="shot" value="2" checked>shot</label>
    <label><input type="checkbox" name="priority_c" value="1" checked>priority center</label>
  </main>
</body>
</html>
