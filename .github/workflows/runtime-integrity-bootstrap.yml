name: Register runtime telemetry integrity module

on:
  push:
    branches:
      - agent/tactics-runtime-telemetry-integrity
    paths:
      - '.github/workflows/runtime-integrity-bootstrap.yml'

permissions:
  contents: write

jobs:
  register:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/tactics-runtime-telemetry-integrity
          fetch-depth: 0
      - name: Register module in bundle contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('src/app/bundle-order.json')
          manifest = json.loads(path.read_text(encoding='utf-8'))
          module_file = 'src/modules/live-parser/runtime-telemetry-integrity.js'
          anchor = 'src/modules/strategy-data-recommendations/strategy-data-task-a-ui-extension.js'

          if module_file not in manifest['files']:
              index = manifest['files'].index(anchor) + 1
              manifest['files'].insert(index, module_file)

          modules = manifest['dependencyAudit']['modules']
          if not any(item.get('file') == module_file for item in modules):
              anchor_index = next(i for i, item in enumerate(modules) if item.get('file') == anchor) + 1
              modules.insert(anchor_index, {
                  'file': module_file,
                  'declares': [],
                  'public': [],
                  'requires': [
                      {
                          'file': 'src/core/config.js',
                          'symbols': ['CONFIG', 'STATE'],
                          'phase': 'runtime'
                      },
                      {
                          'file': 'src/core/api.js',
                          'symbols': ['Api'],
                          'phase': 'runtime'
                      },
                      {
                          'file': 'src/modules/tactics-presets/tactic-control-engine.js',
                          'symbols': ['applyPresetAsync', 'getCurrentTactic'],
                          'phase': 'runtime'
                      },
                      {
                          'file': 'src/modules/live-parser/match-state-parser.js',
                          'symbols': ['MatchStateParser', 'MatchTimingModel'],
                          'phase': 'runtime'
                      },
                      {
                          'file': 'src/modules/live-parser/snapshot-engine.js',
                          'symbols': ['SnapshotEngine'],
                          'phase': 'runtime'
                      },
                      {
                          'file': 'src/modules/live-parser/event-tracker.js',
                          'symbols': ['EventTracker'],
                          'phase': 'runtime'
                      }
                  ],
                  'hostCapabilities': [
                      'document', 'location', 'setTimeout', 'clearTimeout',
                      'setInterval', 'clearInterval'
                  ]
              })

          manifest['dependencyAudit']['expectedModuleCount'] = len(modules)
          path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Validate runtime contract
        run: |
          node --check src/modules/live-parser/runtime-telemetry-integrity.js
          node tools/check-bundle-order.mjs
      - name: Commit registered module and remove bootstrap workflow
        run: |
          set -euo pipefail
          rm .github/workflows/runtime-integrity-bootstrap.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app/bundle-order.json .github/workflows/runtime-integrity-bootstrap.yml
          git commit -m 'runtime: register telemetry integrity bundle layer'
          git push origin HEAD:agent/tactics-runtime-telemetry-integrity
