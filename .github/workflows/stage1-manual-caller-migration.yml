name: Apply Stage 1 manual caller migration

on:
  push:
    branches:
      - agent/stage1-manual-callers
    paths:
      - 'tools/apply-stage1-manual-caller-migration.py'
      - '.github/workflows/stage1-manual-caller-migration.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/stage1-manual-callers
          fetch-depth: 0
      - name: Apply exact source migration
        run: python tools/apply-stage1-manual-caller-migration.py
      - name: Remove one-time migration machinery
        run: rm tools/apply-stage1-manual-caller-migration.py .github/workflows/stage1-manual-caller-migration.yml
      - name: Check syntax and contracts
        run: |
          node --check src/core/config.js
          node --check src/modules/live-parser/snapshot-engine.js
          node --check src/modules/live-parser/event-tracker.js
          node --check src/modules/live-parser/runtime-telemetry-integrity.js
          node --check src/modules/strategy-data-recommendations/recommendation-engine.js
          node --check src/modules/strategy-data-recommendations/strategy-data-task-a-ui-extension.js
          node --check tools/test-legacy-live-parser-boundary.mjs
          node tools/test-runtime-telemetry-integrity.mjs
          node tools/test-manual-match-workflow.mjs
          node tools/test-manual-match-state-bridge.mjs
          node tools/test-legacy-live-parser-boundary.mjs
          node tools/audit-runtime-reachability.mjs --validate-review
          node tools/check-bundle-order.mjs
      - name: Commit Stage 1
        run: |
          git config user.name 'SLF Refactor Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Refactor active manual state callers'
          git push origin HEAD:agent/stage1-manual-callers
