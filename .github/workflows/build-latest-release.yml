name: SLF Validate and Release

on:
  pull_request:
    paths:
      - src/**
      - tools/check-bundle-order.mjs
      - tools/build-latest-userscript.mjs
      - .github/workflows/build-latest-release.yml
  push:
    branches:
      - main
    paths-ignore:
      - releases/latest.user.js
      - releases/latest.meta.js
      - data/version.json
      - CHANGELOG.md
  workflow_dispatch:

jobs:
  validate:
    name: Validate SLF source
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Validate bundle manifest
        id: bundle_check
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node tools/check-bundle-order.mjs 2>&1 | tee bundle-order-report.txt

      - name: Upload bundle-order report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bundle-order-report
          path: bundle-order-report.txt
          if-no-files-found: error
          retention-days: 3

      - name: Enforce bundle-order result
        if: steps.bundle_check.outcome != 'success'
        run: exit 1

  release:
    name: Build and publish latest SLF
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Build latest-only userscript
        shell: bash
        env:
          APPROVED_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          node tools/build-latest-userscript.mjs

      - name: Validate latest-only release
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -e "const fs=require('fs'); console.log(JSON.parse(fs.readFileSync('data/version.json','utf8')).scriptVersion)")
          TEAM4_SCHEMA=$(node -e "const fs=require('fs'); const v=JSON.parse(fs.readFileSync('data/version.json','utf8')); const s=v.build && v.build.team4AlterMinutesSchema; if (!s) process.exit(1); console.log(s)")
          grep -q "@version      $VERSION" releases/latest.user.js
          grep -q "@version      $VERSION" releases/latest.meta.js
          grep -q "@updateURL    https://raw.githubusercontent.com/MostDef2000/SLF/main/releases/latest.meta.js" releases/latest.user.js
          grep -q "@downloadURL  https://raw.githubusercontent.com/MostDef2000/SLF/main/releases/latest.user.js" releases/latest.user.js
          grep -q "scriptVersion: '$VERSION'" releases/latest.user.js
          grep -q "BEGIN SLF FINAL RUNTIME VERSION EXPORT" releases/latest.user.js
          grep -q "Team4AlterCurrentSeasonMinutesBridge" releases/latest.user.js
          grep -q "$TEAM4_SCHEMA" releases/latest.user.js
          ! grep -q "Team4AlterMinutesStrictLinkHotfix" releases/latest.user.js
          ! grep -q "team4-alter-minutes-strict-link-hotfix.js" releases/latest.user.js
          grep -q '"archiveCreated": false' data/version.json
          if [ -e "releases/SLF_${VERSION//./_}.user.js" ]; then
            echo "Forbidden archive file exists: releases/SLF_${VERSION//./_}.user.js"
            exit 1
          fi
          if grep -q "Updated latest-only Tampermonkey artifacts from src/\*\*" CHANGELOG.md; then
            echo "CHANGELOG contains obsolete generic build boilerplate"
            exit 1
          fi
          if grep -q "Preserved Tampermonkey update/download URLs" CHANGELOG.md; then
            echo "CHANGELOG contains obsolete release-policy boilerplate"
            exit 1
          fi
          node --check releases/latest.user.js

      - name: Commit latest-only release outputs
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -e "const fs=require('fs'); console.log(JSON.parse(fs.readFileSync('data/version.json','utf8')).scriptVersion)")
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add releases/latest.user.js releases/latest.meta.js data/version.json CHANGELOG.md
          if git diff --cached --quiet; then
            echo 'No release output changes to commit.'
            exit 0
          fi
          git diff --cached --name-only
          git commit -m "release: publish SLF $VERSION latest-only"
          git push origin HEAD:main
