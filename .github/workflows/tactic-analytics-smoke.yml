name: Tactic runtime, analytics and API smoke

on:
  pull_request:
    paths:
      - 'src/modules/live-parser/runtime-telemetry-integrity.js'
      - 'src/app/bundle-order.json'
      - 'tools/test-runtime-telemetry-integrity.mjs'
      - 'tools/aggregate-tactic-performance.mjs'
      - 'tools/enrich-tactic-match-outcomes.mjs'
      - 'tools/export-tactic-telemetry.mjs'
      - 'tools/validate-tactic-data-quality.mjs'
      - 'tools/generate-tactic-policy-proposals.mjs'
      - 'tools/run-tactic-analytics-pipeline.sh'
      - 'tools/test-tactic-analytics-pipeline.mjs'
      - 'tools/test-tactic-match-outcomes.mjs'
      - 'data/tactics/tactic-evaluation-contract-v1.json'
      - 'vps/api/server.py'
      - 'vps/api/test_server.py'
      - 'vps/api/requirements.txt'
      - 'vps/ops/slf-server.service'
      - 'vps/ops/test_service_contract.py'
      - 'vps/ops/verify_api_deployment.py'
      - 'vps/ops/test_verify_api_deployment.py'
      - 'vps/ops/README.md'
      - '.github/workflows/tactic-analytics-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install API test dependencies
        run: python -m pip install -r vps/api/requirements.txt
      - name: Check syntax
        run: |
          node --check src/modules/live-parser/runtime-telemetry-integrity.js
          node --check tools/test-runtime-telemetry-integrity.mjs
          node --check tools/aggregate-tactic-performance.mjs
          node --check tools/enrich-tactic-match-outcomes.mjs
          node --check tools/export-tactic-telemetry.mjs
          node --check tools/validate-tactic-data-quality.mjs
          node --check tools/generate-tactic-policy-proposals.mjs
          node --check tools/test-tactic-analytics-pipeline.mjs
          node --check tools/test-tactic-match-outcomes.mjs
          bash -n tools/run-tactic-analytics-pipeline.sh
          python -m py_compile \
            vps/api/server.py \
            vps/api/test_server.py \
            vps/ops/test_service_contract.py \
            vps/ops/verify_api_deployment.py \
            vps/ops/test_verify_api_deployment.py
          python -m gunicorn --version
      - name: Validate bundle contract
        run: node tools/check-bundle-order.mjs
      - name: Run runtime telemetry integrity test
        run: node tools/test-runtime-telemetry-integrity.mjs
      - name: Run deterministic analytics smoke test
        run: node tools/test-tactic-analytics-pipeline.mjs
      - name: Run match outcome join test
        run: node tools/test-tactic-match-outcomes.mjs
      - name: Run VPS API storage tests
        run: python -m unittest vps/api/test_server.py -v
      - name: Run API service contract tests
        run: python -m unittest vps/ops/test_service_contract.py -v
      - name: Run API deployment verification tests
        run: python -m unittest vps/ops/test_verify_api_deployment.py -v
