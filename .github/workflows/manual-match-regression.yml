name: Manual match workflow regression

on:
  pull_request:
    paths:
      - 'src/core/config.js'
      - 'src/modules/match-reading/**'
      - 'src/modules/manual-match-telemetry/**'
      - 'src/app/bootstrap.js'
      - 'src/app/compatibility-runner.js'
      - 'src/app/header-matches-layout-compatibility.js'
      - 'src/app/match-rendering-compatibility.js'
      - 'src/app/tactics-dropdown-ui-policy.js'
      - 'src/app/ui-layer.js'
      - 'src/app/userscript-header.js'
      - 'src/app/bundle-order.json'
      - 'releases/latest.user.js'
      - 'tools/test-manual-match-runtime.mjs'
      - 'tools/test-manual-match-workflow.mjs'
      - 'tools/test-manual-match-state-bridge.mjs'
      - 'tools/test-manual-telemetry-legacy-boundary.mjs'
      - 'tools/test-manual-telemetry-final-boundary.mjs'
      - 'tools/audit-runtime-reachability.mjs'
      - 'data/audit/runtime-reachability-review-v1.json'
      - 'data/audit/manual-match-symbol-review-v1.json'
      - 'data/audit/manual-state-envelope-v1.json'
      - 'docs/audit/manual-match-regression-boundary-2026-08-03.md'
      - 'docs/audit/manual-state-envelope-2026-08-03.md'
      - 'docs/audit/legacy-live-parser-stage6-final-2026-08-03.md'
      - '.github/workflows/manual-match-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Check regression test syntax
        run: |
          node --check tools/test-manual-match-runtime.mjs
          node --check tools/test-manual-match-workflow.mjs
          node --check tools/test-manual-match-state-bridge.mjs
          node --check tools/test-manual-telemetry-legacy-boundary.mjs
          node --check tools/test-manual-telemetry-final-boundary.mjs
          node -e "JSON.parse(require('node:fs').readFileSync('data/audit/manual-match-symbol-review-v1.json', 'utf8'))"
          node -e "JSON.parse(require('node:fs').readFileSync('data/audit/manual-state-envelope-v1.json', 'utf8'))"
      - name: Run manual match runtime regression
        run: node tools/test-manual-match-runtime.mjs
      - name: Run manual match workflow regression
        run: node tools/test-manual-match-workflow.mjs
      - name: Run manual state migration regression
        run: node tools/test-manual-match-state-bridge.mjs
      - name: Enforce legacy migration boundary
        run: node tools/test-manual-telemetry-legacy-boundary.mjs
      - name: Enforce final removal boundary
        run: node tools/test-manual-telemetry-final-boundary.mjs
      - name: Build exact candidate artifact
        run: node tools/build-latest-userscript.mjs
      - name: Revalidate reachability inventory
        run: node tools/audit-runtime-reachability.mjs --validate-review
