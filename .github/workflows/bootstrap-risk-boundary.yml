name: Bootstrap risk boundary

on:
  pull_request:
    paths:
      - 'src/app/bootstrap.js'
      - 'tools/test-bootstrap-risk-boundary.mjs'
      - '.github/workflows/bootstrap-risk-boundary.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap-risk-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout reviewed revision
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Check bootstrap boundary test syntax
        run: node --check tools/test-bootstrap-risk-boundary.mjs

      - name: Verify bootstrap startup boundary
        run: node tools/test-bootstrap-risk-boundary.mjs
