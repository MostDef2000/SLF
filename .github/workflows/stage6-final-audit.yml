name: Apply Stage 6 final audit

on:
  pull_request:
    paths:
      - 'tools/apply-stage6-final-audit.py'
      - '.github/workflows/stage6-final-audit.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/stage6-final-live-parser-audit
          fetch-depth: 0
      - name: Apply final audit cleanup
        run: python tools/apply-stage6-final-audit.py
      - name: Remove one-time audit machinery
        run: rm tools/apply-stage6-final-audit.py .github/workflows/stage6-final-audit.yml
      - name: Validate final boundary
        run: |
          node --check tools/test-manual-telemetry-legacy-boundary.mjs
          node --check tools/test-manual-telemetry-final-boundary.mjs
          node tools/test-manual-match-runtime.mjs
          node tools/test-manual-match-workflow.mjs
          node tools/test-manual-match-state-bridge.mjs
          node tools/test-manual-telemetry-legacy-boundary.mjs
          node tools/test-manual-telemetry-final-boundary.mjs
          node tools/audit-runtime-reachability.mjs --validate-review
          node tools/check-bundle-order.mjs
      - name: Restore connector-owned workflows
        run: |
          git checkout HEAD -- .github/workflows
          rm .github/workflows/stage6-final-audit.yml
      - name: Commit Stage 6 repository audit
        run: |
          git config user.name 'SLF Refactor Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Complete live parser removal repository audit'
          git push origin HEAD:agent/stage6-final-live-parser-audit
