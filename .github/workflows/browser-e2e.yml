name: Exact userscript browser E2E

on:
  pull_request:
    paths:
      - 'src/**'
      - 'data/version.json'
      - 'releases/latest.user.js'
      - 'tests/browser/**'
      - '.github/workflows/browser-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout reviewed revision
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Check browser harness syntax
        run: python3 -m py_compile tests/browser/test_exact_userscript.py

      - name: Install pinned browser test dependencies
        run: python3 -m pip install --disable-pip-version-check -r tests/browser/requirements.txt

      - name: Verify browser dependency consistency
        run: python3 -m pip check

      - name: Install pinned Chromium runtime
        run: python3 -m playwright install --with-deps chromium

      - name: Execute exact userscript in browser fixtures
        run: python3 tests/browser/test_exact_userscript.py

      - name: Upload browser failure evidence
        if: failure() && hashFiles('tests/browser/artifacts/**') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: browser-e2e-failure-evidence
          path: tests/browser/artifacts
          if-no-files-found: ignore
          retention-days: 7
