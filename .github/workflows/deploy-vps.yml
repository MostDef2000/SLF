name: SLF VPS Deploy

# Dispatch-index refresh touch 2026-10-12: GitHub's dispatch API validated
# choice inputs against a stale index for this never-run workflow (HTTP 422
# "not in the list of allowed values" for both valid choices). This comment
# touch forces a re-parse; no behavior change.

# SLF VPS production deploy (T7 of specs/deploy-unification/ in the
# workspace repo ai-playground; adapted from the PROVEN lifesim pattern,
# lifesim/.github/workflows/deploy.yml).
#
# Trust model (honest, mirroring lifesim):
#   * workflow_dispatch ONLY. No push, no pull_request, no schedule trigger.
#     The dispatch inputs accept a full 40-hex commit SHA — never a branch
#     name or free-text ref.
#   * Eligibility is bound to GITHUB_TOKEN reads of the Actions API plus a
#     local `git merge-base --is-ancestor` against origin/main. The gate
#     selects the LATEST completed+success push-run of the canonical
#     quality-integration.yml (SLF CI, which runs on push:main since T7a)
#     for the exact input SHA and requires its aggregate `ci` job to have
#     succeeded. Any API/HTTP error fails closed. There is NO artifact
#     signing: anyone able to push to main (and thus produce a green CI
#     push-run) is trusted; single-owner repo => accepted.
#   * Human gate: the owner confirms the deploy in the dev chat BEFORE the
#     orchestrator dispatches (workspace owner decision 2026-10-10). The
#     `confirmation` input is a dispatch-time attestation that must match
#     the exact phrase; the `production` environment intentionally has NO
#     protection rules / required reviewers and is created implicitly.
#   * Host access is a SINGLE forced command over SSH executed by
#     deploy/vps/slf-deploy-launcher on the VPS (installed at
#     /usr/local/sbin/slf-deploy-launcher, lane B bootstrap):
#       slf-deploy-v1 <40-hex sha> <api|exporter-rag>   (bundle on stdin)
#       slf-status-v1                                   (read-only)
#     The VPS has no GitHub egress (outbound :22 blocked), so this is a
#     push-model transport: the workflow bundles the exact checked-out SHA
#     (pinned temp ref refs/slf-deploy-ship) and pipes it over SSH stdin.
#     Host keys are pinned from the repository VARIABLE SLF_VPS_KNOWN_HOSTS;
#     ssh-keyscan is FORBIDDEN (TOFU). No secret values are ever printed;
#     the SSH transcript contains only launcher log lines (shas, markers).
#   * DR-009: SLF_API_TOKEN is never added to GitHub secrets. The api
#     acceptance probe is strictly UNAUTHENTICATED (expects HTTP 401, the
#     same assertion as vps/ops/verify_api_deployment.py).
#
# Rollback: operator-level = re-dispatch the previous sha (printed in
# DEPLOYMENT_ACCEPTED as previous=...) or run the slf-rollback-v1 verb
# (restores the deploy-code.sh backup for that sha) via the sysadmin lane.

on:
  workflow_dispatch:
    inputs:
      deploy_sha:
        description: "Full 40-hex commit SHA already merged to main"
        required: true
        type: string
      target:
        description: "Deployment target component (api | exporter-rag; enforced fail-closed by the gate job)"
        required: true
        type: string
      confirmation:
        description: "Type: deploy confirmed"
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: slf-vps-production
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      sha: ${{ steps.validate.outputs.sha }}
      target: ${{ steps.validate.outputs.target }}
      run_id: ${{ steps.select.outputs.run_id }}
      run_url: ${{ steps.select.outputs.run_url }}
    steps:
      - name: Require default branch
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "::error::deploy must be dispatched from refs/heads/main (got ${GITHUB_REF})"
            exit 1
          fi

      - name: Require dispatch confirmation
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          # Fail-closed attestation; the durable human gate is the dev chat
          # confirmation that precedes every dispatch (owner decision
          # 2026-10-10). Input goes through env, never direct interpolation
          # into the script (expression-injection guard).
          if [ "${CONFIRMATION}" != "deploy confirmed" ]; then
            echo "::error::confirmation input must be exactly: deploy confirmed"
            exit 1
          fi

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - name: Validate SHA, target and ancestry
        id: validate
        env:
          SHA: ${{ inputs.deploy_sha }}
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          # Fail closed on anything but a full lowercase 40-hex commit SHA.
          if ! [[ "${SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::deploy_sha must be a full 40-hex lowercase commit SHA (got: ${SHA})"
            exit 1
          fi
          case "${TARGET}" in
            api|exporter-rag) ;;
            *) echo "::error::target must be api or exporter-rag (got: ${TARGET})"; exit 1 ;;
          esac
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "${SHA}" origin/main
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "target=${TARGET}" >> "$GITHUB_OUTPUT"

      - name: Select trusted quality-integration push run
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ steps.validate.outputs.sha }}
        run: |
          set -euo pipefail
          # -f: any non-2xx API response fails the gate (fail closed).
          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/actions/workflows/quality-integration.yml/runs?head_sha=${SHA}&event=push&branch=main&status=completed&per_page=100" \
            -o "${RUNNER_TEMP}/runs.json"
          python3 - "${RUNNER_TEMP}/runs.json" "${SHA}" > "${RUNNER_TEMP}/selected.json" <<'PY'
          import json, re, sys

          path, sha = sys.argv[1], sys.argv[2]
          if not re.fullmatch(r"[0-9a-f]{40}", sha):
              sys.exit("GATE-ERR: sha must be 40 lowercase hex")
          try:
              with open(path, encoding="utf-8") as fh:
                  data = json.load(fh)
          except (OSError, ValueError) as exc:
              sys.exit(f"GATE-ERR: runs payload unreadable: {exc}")
          runs = data.get("workflow_runs") if isinstance(data, dict) else None
          if not isinstance(runs, list):
              sys.exit("GATE-ERR: runs payload malformed (no workflow_runs list)")
          candidates = [
              run
              for run in runs
              if isinstance(run, dict)
              and run.get("head_sha") == sha
              and run.get("event") == "push"
              and run.get("head_branch") == "main"
              and run.get("status") == "completed"
              and run.get("conclusion") == "success"
          ]
          if not candidates:
              sys.exit("GATE-ERR: no completed+success quality-integration.yml push-run for this sha on main")

          def key(run):
              run_id = run.get("id")
              return (str(run.get("created_at") or ""), int(run_id) if isinstance(run_id, int) else 0)

          best = max(candidates, key=key)
          print(json.dumps({
              "id": best.get("id"),
              "url": best.get("html_url"),
              "run_number": best.get("run_number"),
              "created_at": best.get("created_at"),
          }))
          PY
          RUN_ID="$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["id"])' "${RUNNER_TEMP}/selected.json")"
          RUN_URL="$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["url"])' "${RUNNER_TEMP}/selected.json")"
          echo "run_id=${RUN_ID}" >> "$GITHUB_OUTPUT"
          echo "run_url=${RUN_URL}" >> "$GITHUB_OUTPUT"

      - name: Verify the aggregate ci job succeeded
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ steps.select.outputs.run_id }}
        run: |
          set -euo pipefail
          # per_page=100 covers SLF CI (7 jobs); fail closed on truncated
          # pagination or empty/error payloads.
          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/actions/runs/${RUN_ID}/jobs?filter=latest&per_page=100" \
            -o "${RUNNER_TEMP}/jobs.json"
          python3 - "${RUNNER_TEMP}/jobs.json" <<'PY'
          import json, sys

          try:
              with open(sys.argv[1], encoding="utf-8") as fh:
                  data = json.load(fh)
          except (OSError, ValueError) as exc:
              sys.exit("GATE-ERR: jobs payload unreadable: %s" % exc)
          if not isinstance(data, dict):
              sys.exit("GATE-ERR: jobs payload not an object")
          if data.get("incomplete") is True:
              sys.exit("GATE-ERR: jobs payload marked incomplete (pagination)")
          jobs = data.get("jobs")
          if not isinstance(jobs, list) or not jobs:
              sys.exit("GATE-ERR: no jobs returned")
          total = data.get("total_count")
          if isinstance(total, int) and not isinstance(total, bool) and total > len(jobs):
              sys.exit("GATE-ERR: pagination incomplete: %d of %d jobs fetched" % (len(jobs), total))
          # SLF CI (quality-integration.yml): the aggregate `ci` job requires
          # every domain job to pass (its own `test "$result" = success` loop),
          # so requiring `ci` == success is the trusted gate. Any other job
          # that is not success/skipped also fails the gate.
          required = "ci"
          accepted_other = {"success", "skipped"}
          seen = []
          for job in jobs:
              if not isinstance(job, dict) or not isinstance(job.get("name"), str) or not job["name"]:
                  sys.exit("GATE-ERR: malformed job entry")
              seen.append((job["name"], job.get("conclusion")))
          gate = [conclusion for name, conclusion in seen if name == required]
          if not gate:
              sys.exit("GATE-ERR: required job missing: ci")
          for conclusion in gate:
              if conclusion != "success":
                  sys.exit("GATE-ERR: job ci conclusion=%r (want success)" % conclusion)
          for name, conclusion in seen:
              if name != required and conclusion not in accepted_other:
                  sys.exit("GATE-ERR: job %s conclusion=%r (want success or skipped)" % (name, conclusion))
          print("jobs-ok: ci succeeded; all %d job(s) success/skipped" % len(seen))
          PY

  deploy:
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Owner decision 2026-10-10 (workspace deploy-unification): NO protection
    # rules on this environment — the human gate is the chat confirmation
    # before dispatch, not a GitHub reviewer gate. Do not add required
    # reviewers without a new owner decision. Created implicitly on first run.
    environment: production
    env:
      DEPLOY_SHA: ${{ needs.gate.outputs.sha }}
      DEPLOY_TARGET: ${{ needs.gate.outputs.target }}
      SLF_VPS_HOST: ${{ secrets.SLF_VPS_HOST }}
      SLF_VPS_USER: ${{ secrets.SLF_VPS_USER }}
    outputs:
      previous_sha: ${{ steps.accepted.outputs.previous_sha }}
    steps:
      # Defense in depth: never interpolate an unvalidated value into the
      # forced command, even though the gate already validated it.
      - name: Guard SHA and target again
        run: |
          set -euo pipefail
          [[ "${DEPLOY_SHA}" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::bad sha from gate: ${DEPLOY_SHA}"; exit 1; }
          case "${DEPLOY_TARGET}" in api|exporter-rag) ;; *) echo "::error::bad target from gate: ${DEPLOY_TARGET}"; exit 1 ;; esac

      - name: Checkout the exact dispatch SHA
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ needs.gate.outputs.sha }}
          fetch-depth: 0

      - name: Verify checkout is exactly the dispatch SHA
        run: |
          set -euo pipefail
          HEAD_SHA="$(git rev-parse HEAD)"
          echo "checked out ${HEAD_SHA}, dispatch ${DEPLOY_SHA}"
          test "${HEAD_SHA}" = "${DEPLOY_SHA}"

      - name: Build the deployment bundle from the exact SHA
        run: |
          set -euo pipefail
          # The launcher verifies the bundle carries exactly this SHA on
          # refs/slf-deploy-ship (a raw-SHA bundle create is refused by git,
          # so the ref is pinned first). Full history: the on-box checkout
          # may be several commits behind.
          git update-ref refs/slf-deploy-ship "${DEPLOY_SHA}"
          git bundle create "${RUNNER_TEMP}/slf-deploy.bundle" refs/slf-deploy-ship
          git bundle verify "${RUNNER_TEMP}/slf-deploy.bundle"
          ls -l "${RUNNER_TEMP}/slf-deploy.bundle"

      - name: Configure SSH
        env:
          SLF_VPS_DEPLOY_KEY: ${{ secrets.SLF_VPS_DEPLOY_KEY }}
          # Host keys are pinned from a repo variable; ssh-keyscan is FORBIDDEN.
          SLF_VPS_KNOWN_HOSTS: ${{ vars.SLF_VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          if [ -z "${SLF_VPS_DEPLOY_KEY}" ] || [ -z "${SLF_VPS_HOST}" ] || [ -z "${SLF_VPS_USER}" ]; then
            echo "::error::SLF_VPS_DEPLOY_KEY / SLF_VPS_HOST / SLF_VPS_USER secrets are not configured yet (owner adds values; names only in this repo)"
            exit 1
          fi
          if [ -z "${SLF_VPS_KNOWN_HOSTS}" ]; then
            echo "::error::SLF_VPS_KNOWN_HOSTS variable is not configured (pinned host keys; ssh-keyscan is forbidden)"
            exit 1
          fi
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SLF_VPS_DEPLOY_KEY" > "$HOME/.ssh/id_deploy"
          chmod 600 "$HOME/.ssh/id_deploy"
          printf '%s\n' "$SLF_VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          test -s "$HOME/.ssh/known_hosts"

      - name: Run forced deploy command on VPS (bundle on stdin)
        run: |
          set -euo pipefail
          # Single forced command; the launcher on the host verifies the
          # bundle SHA, applies it to the on-box checkout and runs the
          # repo's own deploy-code.sh (readiness-gated) with automatic
          # fail-closed semantics. pipefail propagates a non-zero launcher
          # exit through tee; the full transcript (stdout+stderr) is kept
          # for the marker check and the artifact step.
          ssh -i "$HOME/.ssh/id_deploy" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o ConnectTimeout=15 \
            "${SLF_VPS_USER}@${SLF_VPS_HOST}" "slf-deploy-v1 ${DEPLOY_SHA} ${DEPLOY_TARGET}" \
            < "${RUNNER_TEMP}/slf-deploy.bundle" \
            2>&1 | tee "${RUNNER_TEMP}/deploy-transcript.log"

      - name: Verify deployment accepted marker
        id: accepted
        run: |
          set -euo pipefail
          # The launcher must print the acceptance marker with the exact
          # requested sha and the on-box previous sha; a missing marker
          # means the host contract is broken; fail the job.
          if ! grep -Fq "DEPLOYMENT_ACCEPTED sha=${DEPLOY_SHA} previous=" "${RUNNER_TEMP}/deploy-transcript.log"; then
            echo "::error::DEPLOYMENT_ACCEPTED marker for ${DEPLOY_SHA} missing from host transcript"
            exit 1
          fi
          MARKER_LINE="$(grep -F "DEPLOYMENT_ACCEPTED sha=${DEPLOY_SHA} previous=" "${RUNNER_TEMP}/deploy-transcript.log" | tail -n 1)"
          PREVIOUS_SHA="${MARKER_LINE#*previous=}"
          if ! [[ "${PREVIOUS_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::previous sha from host marker is not a 40-hex sha: ${PREVIOUS_SHA}"
            exit 1
          fi
          echo "previous_sha=${PREVIOUS_SHA}" >> "$GITHUB_OUTPUT"
          # Surface the byte-exact marker (sha + previous recorded on-box).
          echo "${MARKER_LINE}"
          {
            echo "### Deploy accepted by VPS"
            echo '```'
            echo "${MARKER_LINE}"
            echo '```'
            echo "Target: ${DEPLOY_TARGET}"
            echo "Trusted CI run: ${{ needs.gate.outputs.run_url }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Health probe (api target, unauthenticated)
        if: ${{ needs.gate.outputs.target == 'api' }}
        run: |
          set -euo pipefail
          # DR-009: no SLF_API_TOKEN in GitHub secrets — the external probe
          # is strictly unauthenticated and asserts HTTP 401, the same
          # contract as vps/ops/verify_api_deployment.py. Public endpoint
          # from src/core/config.js (SERVER_URL).
          for attempt in 1 2 3 4 5; do
            CODE="$(curl -s -o /dev/null --max-time 15 --write-out '%{http_code}' https://slf-api.mostdef.ru/api/analysis || true)"
            echo "attempt ${attempt}: HTTP ${CODE:-000}"
            if [ "${CODE}" = "401" ]; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::unauthenticated /api/analysis did not return 401 after deploy"
          exit 1

      - name: Transport status probe (slf-status-v1)
        run: |
          set -euo pipefail
          # Read-only transport report: launcher sha256, manifest records and
          # per-component deployed-sha/drift fields. `slf-status-v1` exits 1
          # when ANY recorded component drifts from the shared checkout HEAD
          # — which is normal right after deploying only one of the two
          # components — so the probe's exit code is captured for the
          # transcript and the HARD verification is the greps below: the
          # transcript must contain the transport block AND record the
          # target component's deployed sha equal to the dispatch sha.
          probe_rc=0
          ssh -i "$HOME/.ssh/id_deploy" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o ConnectTimeout=15 \
            "${SLF_VPS_USER}@${SLF_VPS_HOST}" "slf-status-v1" \
            < /dev/null \
            2>&1 | tee "${RUNNER_TEMP}/status-transcript.log" || probe_rc=$?
          echo "slf-status-v1 probe rc=${probe_rc} (0 = no drift among recorded components; 1 is tolerated here when it comes from the sibling component, the greps below are the gate)"
          grep -Fq "launcher_sha256=" "${RUNNER_TEMP}/status-transcript.log" \
            || { echo "::error::status transcript missing transport report (launcher_sha256=)"; exit 1; }
          grep -Fq "${{ needs.gate.outputs.target }}_deployed_sha=${{ needs.gate.outputs.sha }}" "${RUNNER_TEMP}/status-transcript.log" \
            || { echo "::error::deployed sha mismatch: transcript does not record ${{ needs.gate.outputs.target }} deployed sha == dispatch sha"; exit 1; }

      - name: Upload SSH transcripts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: deploy-transcript-${{ needs.gate.outputs.target }}-${{ needs.gate.outputs.sha }}
          path: |
            ${{ runner.temp }}/deploy-transcript.log
            ${{ runner.temp }}/status-transcript.log
          retention-days: 14
          # If the job failed before SSH (e.g. bad secrets), there is no
          # transcript; any launcher output that DID happen is always captured.
          if-no-files-found: ignore
          # Re-running the same dispatch must replace the prior artifact
          # rather than fail on a name collision.
          overwrite: true
