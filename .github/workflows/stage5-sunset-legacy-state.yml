name: Apply Stage 5 legacy state sunset

on:
  pull_request:
    paths:
      - 'tools/apply-stage5-sunset-legacy-state.py'
      - '.github/workflows/stage5-sunset-legacy-state.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/stage5-sunset-legacy-state
          fetch-depth: 0
      - name: Apply exact compatibility sunset
        run: python tools/apply-stage5-sunset-legacy-state.py
      - name: Remove one-time migration machinery
        run: rm tools/apply-stage5-sunset-legacy-state.py .github/workflows/stage5-sunset-legacy-state.yml
      - name: Check sunset contracts
        run: |
          node --check src/core/config.js
          node --check src/modules/manual-match-telemetry/snapshot-engine.js
          node --check src/modules/manual-match-telemetry/manual-match-runtime.js
          node --check tools/test-manual-match-runtime.mjs
          node --check tools/test-manual-match-state-bridge.mjs
          node tools/test-manual-match-runtime.mjs
          node tools/test-manual-match-workflow.mjs
          node tools/test-manual-match-state-bridge.mjs
          node tools/test-legacy-live-parser-boundary.mjs
          node tools/audit-runtime-reachability.mjs --validate-review
          node tools/check-bundle-order.mjs
      - name: Commit Stage 5
        run: |
          git config user.name 'SLF Refactor Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Sunset legacy live parser state compatibility'
          git push origin HEAD:agent/stage5-sunset-legacy-state
