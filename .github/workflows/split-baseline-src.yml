name: Split canonical baseline source

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/split-baseline-src.yml
      - tools/split-baseline-src.mjs
      - releases/latest.user.js

permissions:
  contents: write

jobs:
  split-baseline-src:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify no release publish operation
        shell: bash
        run: |
          test -f releases/latest.user.js
          test -f tools/split-baseline-src.mjs
          grep -q '@version      4.4.72' releases/latest.user.js

      - name: Run structural splitter
        run: node tools/split-baseline-src.mjs

      - name: Verify structural split output
        shell: bash
        run: |
          test -f src/app/userscript-header.js
          test -f src/app/bundle-order.json
          test -f src/app/module-registry.json
          test -f src/core/domain.js
          test -d src/modules
          grep -q 'Structural split only' src/app/bundle-order.json
          grep -q '4.4.72' src/app/bundle-order.json

      - name: Ensure release files are untouched
        shell: bash
        run: |
          git diff --exit-code -- releases/latest.user.js releases/latest.meta.js releases/SLF_4_4_72.user.js data/version.json CHANGELOG.md

      - name: Commit generated src files only
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src
          if git diff --cached --quiet; then
            echo 'No generated src changes to commit.'
            exit 0
          fi
          git diff --cached --name-only | grep -v '^src/' && {
            echo 'Unexpected non-src files staged.'
            exit 1
          } || true
          git commit -m 'chore: split canonical baseline 4.4.72 into src modules'
          git push origin HEAD:main
